<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff5f7">
<title>အဆင်ပြေရဲ့လား</title>
<style>
  :root{--pink:#f7a9bb;--deep:#704b5a;--ink:#51434a;--soft:#fff7f8;--green:#55b99a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans Myanmar","Myanmar Text",sans-serif;color:var(--ink);
    background:#241d22;
    overflow-x:hidden}
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .heart{position:absolute;bottom:-40px;color:#f3a4b8;opacity:.65;animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
  main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:28px 16px}
  .card{width:min(100%,440px);min-height:610px;background:rgba(255,255,255,.83);border:1px solid rgba(255,255,255,.95);
    border-radius:30px;box-shadow:0 18px 60px rgba(145,91,109,.13);padding:28px 23px 24px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .tiny{font-size:12px;letter-spacing:2px;color:#c18a9b;margin-bottom:12px}
  h1{font-size:clamp(24px,6vw,31px);line-height:1.55;color:#795565;margin:10px 0 12px;font-weight:750}
  p{font-size:15px;line-height:2;color:#78666e;margin:7px 0;white-space:pre-line}
  .bear-wrap{width:190px;height:190px;display:grid;place-items:center;margin:4px auto 10px;position:relative}
  .bear{width:100%;height:100%;filter:drop-shadow(0 8px 5px rgba(117,75,89,.09));animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .spark{position:absolute;font-size:22px;animation:twinkle 1.8s ease-in-out infinite}
  .s1{top:18px;left:12px}.s2{right:8px;top:48px;animation-delay:.7s}.s3{bottom:24px;right:20px;animation-delay:1.1s}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.18)}}
  .buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;width:100%}
  button{font:inherit;border:0;border-radius:16px;padding:13px 19px;cursor:pointer;font-weight:700;transition:transform .18s,box-shadow .18s}
  button:active{transform:scale(.97)}
  .yes{background:linear-gradient(135deg,#62c7a5,#42ad8b);color:white;box-shadow:0 8px 18px #65bd9d44;min-width:175px}
  .no{background:#fff0f3;color:#a66d7f;border:1px solid #f4d8e0;min-width:145px}
  .next{background:#805d6c;color:white;min-width:190px;margin-top:20px}
  .sound{position:absolute;right:16px;top:15px;background:#fff1f4;color:#9b7180;padding:8px 11px;font-size:12px;border-radius:30px}
  .progress{display:flex;gap:5px;margin:0 0 12px}
  .dot{height:5px;width:22px;border-radius:10px;background:#f2dce2}
  .dot.active{background:#d88da4}
  .footer{font-size:11px;color:#c2a2ad;margin-top:22px}
  .hidden{display:none}
  .fade{animation:fade .45s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:380px){.card{min-height:570px;padding:24px 17px}.bear-wrap{width:165px;height:165px}p{font-size:14px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>

      <path d="M57 163 Q36 169 45 183 Q56 194 77 174 M163 163 Q184 169 175 183 Q164 194 143 174" fill="#c99678" stroke="#ad795f" stroke-width="2"/>
      <path d="M91 175 Q110 161 129 175 L124 190 Q110 198 96 190Z" fill="#f4e3d9"/>
      <path d="M110 177 C95 163 84 180 110 197 C136 180 125 163 110 177Z" fill="#e98da7"/>
    </svg>
  </div>
  <div id="content" class="fade">
    <h1>ဟေး... အဆင်ပြေရဲ့လား။</h1>
    <p>အချိန်တွေ တော်တော်ကြာသွားပြီနော်။
အခုတလော မင်းရဲ့နေ့ရက်တွေ အဆင်ပြေနေမယ်လို့ မျှော်လင့်ပါတယ်။</p>
    <div class="buttons">
      <button class="yes" id="okayBtn">အဆင်ပြေပါတယ် ❤️</button>
      <button class="no" id="notOkayBtn">မပြေသေးဘူး</button>
    </div>
  </div>
  <div class="footer">ဖြည်းဖြည်းလေး ဖတ်ကြည့်ပါနော်</div>
</section>
</main>
<script>
const content=document.getElementById('content');
const dots=[...document.querySelectorAll('.dot')];
let step=0;
const pages=[
 {title:'ကြားရတာ ဝမ်းသာပါတယ်။',text:'မင်းအဆင်ပြေနေတယ်ဆိုတာ သိရတာ ကောင်းပါတယ်။\\nအရင်ကလို နေ့တိုင်း စကားမပြောဖြစ်တော့ပေမဲ့\\nမင်းအတွက် ကောင်းတာတွေ ဖြစ်စေချင်တဲ့ စိတ်ကတော့ ရှိနေပါတယ်။',button:'နောက်တစ်ခု ဖတ်မယ်'},
 {title:'အဆင်မပြေတဲ့နေ့တွေလည်း ရှိမှာပေါ့။',text:'အရာရာတိုင်းက အမြဲတမ်း လွယ်ကူမနေတတ်ဘူးလေ။\\nကိုယ့်ကိုယ်ကို အရမ်းမဖိအားပေးပါနဲ့။\\nအနားယူဖို့ လိုတဲ့အခါ အနားယူပါ။\\nမင်းလည်း ပျော်ရွှင်ခွင့်ရှိတဲ့သူတစ်ယောက်ပါ။',button:'ဆက်ဖတ်မယ်'},
 {title:'အမှတ်တရလေးတွေ...',text:'တစ်ခါတလေ အရင်က အချိန်တွေကို ပြန်သတိရမိတယ်။\\nအတူရယ်မောခဲ့တဲ့ နေ့ရက်လေးတွေက\\nအခုတော့ အမှတ်တရတွေအဖြစ် ကျန်ခဲ့ပါပြီ။\\nအဲဒီအချိန်တွေကို မကောင်းတဲ့အရာလို့ မမြင်ပါဘူး။',button:'နောက်ဆုံးစာလေး'},
 {title:'နောက်ဆုံး စကားလေး...',text:'မင်းရဲ့နေ့ရက်တိုင်းမှာ အေးချမ်းမှုနဲ့ ပျော်ရွှင်မှုတွေ ရှိနေပါစေ။\\nကိုယ့်လမ်းကိုယ် လျှောက်ရင်း အရာရာ အဆင်ပြေပါစေ။\\n\\nတစ်နေ့နေ့မှာ ပြန်ဆုံဖြစ်ရင်လည်း ကောင်းတာပေါ့။\\nအဲဒီအချိန်ကျရင် နှစ်ယောက်လုံး အဆင်ပြေနေကြပါစေ။',button:'ဒီမှာပဲ အဆုံးသတ်မယ်'}
];
function showPage(n){
 step=n; dots.forEach((d,i)=>d.classList.toggle('active',i<=n));
 const p=pages[n];
 content.classList.remove('fade'); void content.offsetWidth; content.classList.add('fade');
 content.innerHTML=`<h1>${p.title}</h1><p>${p.text.replaceAll('\\n','<br>')}</p><button class="next" id="nextBtn">${p.button} ♡</button>`;
 document.getElementById('nextBtn').addEventListener('click',()=> n===3?finish():showPage(n+1));
}
function finish(){
 dots.forEach(d=>d.classList.add('active'));
 content.classList.remove('fade');void content.offsetWidth;content.classList.add('fade');
 content.innerHTML='<h1>ဂရုစိုက်ပါနော်။</h1><p>ဒီစာလေးကို ဖတ်ပေးတဲ့အတွက် ကျေးဇူးပါ။\\nပြန်စာပို့ဖို့ မလိုပါဘူး။\\nမင်းအဆင်ပြေနေဖို့ပဲ ဆုတောင်းပေးပါတယ်။</p><div style="font-size:34px;margin-top:15px">♡</div>';
}
document.getElementById('okayBtn').addEventListener('click',()=>showPage(0));
document.getElementById('notOkayBtn').addEventListener('click',()=>showPage(1));
// Floating hearts
const heartBox=document.getElementById('hearts');
for(let i=0;i<18;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%3?'♡':'♥';h.style.left=(Math.random()*100)+'%';h.style.fontSize=(12+Math.random()*17)+'px';h.style.animationDuration=(9+Math.random()*11)+'s';h.style.animationDelay=(-Math.random()*18)+'s';heartBox.appendChild(h)}
// A quiet, original two-note ambient sound made in-browser; starts only after a tap.
let audioCtx=null, playing=false, timer=null;
const soundBtn=document.getElementById('soundBtn');
function note(freq,duration,when){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(.035,when+.08);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(when);osc.stop(when+duration+.03)}
function playLoop(){if(!playing)return;const now=audioCtx.currentTime;[392,523.25,440,349.23].forEach((f,i)=>note(f,1.5,now+i*1.1));timer=setTimeout(playLoop,4700)}
soundBtn.addEventListener('click',async()=>{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();playing=!playing;if(playing){soundBtn.textContent='♫ အသံဖွင့်ထားသည်';playLoop()}else{clearTimeout(timer);soundBtn.textContent='♫ အသံပိတ်ထားသည်'}});
</script>
</body>
